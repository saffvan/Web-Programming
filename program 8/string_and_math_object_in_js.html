<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>String Functions and Math Object in JS</title>
</head>
<body>

    <script>
        let s1 = 'Hello';
        //var st1 = "Helloo";
        //let str1 = 'hello world';
        
        document.writeln("<h2>String Functions</h2>");
        document.writeln("String 1 : ",s1, "<br>");
        document.writeln("Slice(0,2): ", s1.slice(0, 2), "<br>");
        document.writeln("Slice(3): ", s1.slice(3), "<br>");
        document.writeln("Slice(-4,-1): ", s1.slice(-4, -1), "<br>");
        
        document.writeln("Substring(0,3): ", s1.substring(0, 3), "<br>");
        document.writeln("Substr(0,4): ", s1.substr(0, 4), "<br>");
        document.writeln("Replace(): ", s1.replace("Hello", "Hi, How are You!"), "<br><br>");
        
        let s2 = "hi, you say hi";
		document.writeln("String 2 : ",s2, "<br>");
        let news2 = s2.replace(/hi/g, "hello");
        document.writeln("Replace('hi' to 'hello'): ", news2, "<br>");
        
        let news3 = s2.replace(/hi/g, (match) => match.toUpperCase());
        document.writeln("Replace('hi' to UpperCase): ", news3, "<br>");
        
        let t = s2.replaceAll("hi", "hey");
        document.writeln("ReplaceAll('hi' to 'hey'): ", t, "<br><br>");
        
        document.writeln("<h2>Math Methods</h2>");
        document.writeln("Euler's number is: ", Math.E, "<br>");
        document.writeln("Value of PI is: ", Math.PI, "<br>");
        document.writeln("Square root of 2 is: ", Math.SQRT2, "<br>");
        document.writeln("Square root of 1/2 is: ", Math.SQRT1_2, "<br>");
        document.writeln("Log 2 is: ", Math.LN2, "<br>");
        document.writeln("Log 10 is: ", Math.LN10, "<br>");
        document.writeln("Log E to the base 2 is: ", Math.LOG2E, "<br>");
        document.writeln("Log E to the base 10 is: ", Math.LOG10E, "<br><br>");
        
        document.writeln("Absolute value of -5 is: ", Math.abs(-5), "<br>");
        document.writeln("Cube root of 27 is: ", Math.cbrt(27), "<br>");
        document.writeln("Round up 2.45: ", Math.ceil(2.45), "<br>");
        document.writeln("Exponential of 3 (e³): ", Math.exp(3), "<br>");
        document.writeln("2 to the power 3 is: ", Math.pow(2, 3), "<br>");
        document.writeln("Minimum of (5, 2, 1) is: ", Math.min(5, 2, 1), "<br>");
        document.writeln("Maximum of (7, 10, 3, 1) is: ", Math.max(7, 10, 3, 1), "<br>");
        document.writeln("Square root of 25 is: ", Math.sqrt(25), "<br>");
        document.writeln("Truncated value of 4.56 is: ", Math.trunc(4.56), "<br>");
        document.writeln("Rounded value of 6.2 is: ", Math.round(6.2), "<br>");
        document.writeln("Random number is: ", Math.random(), "<br>");
    </script>

</body>
</html>
