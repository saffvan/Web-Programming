<html>
<head>
<title>form</title>
</head>
<body>

<h1 align="center"><i>Registration Form</i></h1>
<br>
<form>
<label>Name :</label>
<input type="text" placeholder="name :" required><br><br>

<label>Email :</label>
<input type="email" placeholder="example@gmail.com" required><br><br>

<label>Password :</label>
<input type="password" placeholder="password :" required><br><br>

<label>Mobile No:</label>
<input type="tel" maxlength="10" pattern="\d{10}" placeholder="+91"><br><br>

<label>Address :</label><br>
<textarea placeholder="Enter your Address"></textarea><br><br>

<label>DoB :</label>
<input type="date" required><br><br>

<label> Gender :</label>
<label>Male</label>
<input type="radio" name="gender">
<label>Female</label>
<input type="radio" name="gender">
<label>Others</label>
<input type="radio" name="gender"><br><br>

<label>Nationality :</label>
<select>
<option>Indian</option>
<option>German</option>
<option>American</option>
<option>French</option>
</select> <br><br>

<fieldset>
<legend> Language known :</legend><br>
<input type="checkbox">
<label>Malayalam</label><br>
<input type="checkbox">
<label>English</label><br>
<input type="checkbox">
<label>Hindi</label><br>
<input type="checkbox">
<label>Arabic</label><br><br>
</fieldset>

<br><br><input type="submit" placeholder="Submit">
<button>Cancel</button>

</form>

</body>
</html>
