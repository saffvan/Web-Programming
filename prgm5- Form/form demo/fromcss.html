<html>
<head>
<title>Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        padding: 20px;
    }

    form {
        width: 400px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        font-style: italic;
    }

    label {
        font-weight: bold;
    }

    input, textarea, select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    textarea {
        height: 70px;
        resize: none;
    }

    fieldset {
        padding: 10px;
        border-radius: 5px;
    }

    input[type="radio"], input[type="checkbox"] {
        width: auto;
    }

    input[type="submit"], button {
        width: 49%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    input[type="submit"] {
        background-color: #4CAF50;
        color: white;
    }

    button {
        background-color: #f44336;
        color: white;
    }
</style>

</head>
<body>

<h1><i>Registration Form</i></h1>

<form>
<label>Name :</label>
<input type="text" placeholder="name :" required><br><br>

<label>Email :</label>
<input type="email" placeholder="example@gmail.com" required><br><br>

<label>Password :</label>
<input type="password" placeholder="password :" required><br><br>

<label>Mobile No:</label>
<input type="tel" maxlength="10" pattern="\d{10}" placeholder="+91"><br><br>

<label>Address :</label>
<textarea placeholder="Enter your Address"></textarea><br><br>

<label>DoB :</label>
<input type="date" required><br><br>

<label> Gender :</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Others<br><br>

<label>Nationality :</label>
<select>
<option>Indian</option>
<option>German</option>
<option>American</option>
<option>French</option>
</select> <br><br>

<fieldset>
<legend>Language known :</legend>
<input type="checkbox"> Malayalam <br>
<input type="checkbox"> English <br>
<input type="checkbox"> Hindi <br>
<input type="checkbox"> Arabic <br>
</fieldset>

<br>
<input type="submit" value="Submit">
<button>Cancel</button>

</form>

</body>
</html>
